<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barGrow {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.25); }
    }
    @keyframes chipShine {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #FCD34D); }
    }

    .orb1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 8s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-group { animation: cardFloat 5s ease-in-out infinite; transform-origin: 920px 200px; }
    .chart-line { stroke-dasharray: 1000; stroke-dashoffset: 0; animation: lineFlow 4s ease-in-out infinite alternate; }
    .chip { animation: chipShine 3s infinite; }
    .bar1 { animation: barGrow 3s ease-in-out infinite 0s; transform-origin: bottom; }
    .bar2 { animation: barGrow 3s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .bar3 { animation: barGrow 3s ease-in-out infinite 1s; transform-origin: bottom; }
    .bar4 { animation: barGrow 3s ease-in-out infinite 1.5s; transform-origin: bottom; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Glowing Orbs -->
  <circle class="orb1" cx="200" cy="100" r="180" fill="#4F46E5" opacity="0.25" filter="url(#glow)" />
  <circle class="orb2" cx="1000" cy="300" r="220" fill="#0EA5E9" opacity="0.2" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="720" y1="0" x2="720" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
  </g>

  <!-- Left Content: Title, Subtitle, Badges -->
  <g transform="translate(70, 75)">
    <!-- Category Badge -->
    <rect width="210" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#10B981" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#A7F3D0" letter-spacing="0.5">FINTECH &amp; SPEND CONTROL</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Awesome Spend
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-1">
      Management Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      Curated Corporate Cards, Expense Management, Procurement &amp; AP Automation
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">💳 Corporate Cards</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="150" height="34" rx="8" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.3" />
      <text x="165" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818CF8">📊 Expense Control</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="165" height="34" rx="8" fill="#1E293B" stroke="#C084FC" stroke-opacity="0.3" />
      <text x="325" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#C084FC">⚡ Procure-to-Pay</text>
    </g>
  </g>

  <!-- Right Visual: Floating Credit Card & Dynamic Spending Chart -->
  <g class="card-group">
    <!-- Background Analytics Card -->
    <rect x="740" y="190" width="360" height="150" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="760" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B">REAL-TIME SPEND ANALYTICS</text>
    
    <!-- Mini Chart Bars -->
    <g fill="#38BDF8">
      <rect class="bar1" x="765" y="250" width="16" height="60" rx="4" opacity="0.85" />
      <rect class="bar2" x="795" y="235" width="16" height="75" rx="4" opacity="0.85" />
      <rect class="bar3" x="825" y="260" width="16" height="50" rx="4" opacity="0.85" />
      <rect class="bar4" x="855" y="220" width="16" height="90" rx="4" fill="#818CF8" />
    </g>

    <!-- Chart Line Overlay -->
    <path class="chart-line" d="M 773 255 Q 810 210, 833 245 T 890 200 T 1060 215" fill="none" stroke="#C084FC" stroke-width="3" filter="url(#glow)" />

    <!-- Metric Label -->
    <text x="1000" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#10B981">+34.8%</text>
    <text x="1000" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">AUTOMATED SAVINGS</text>

    <!-- Main Floating Corporate Card -->
    <g transform="translate(730, 60)" filter="url(#cardShadow)">
      <rect width="320" height="190" rx="16" fill="url(#cardGrad)" />
      
      <!-- Card Patterns -->
      <path d="M 0 100 Q 160 40, 320 120 L 320 190 L 0 190 Z" fill="#FFFFFF" opacity="0.08" />
      <circle cx="270" cy="45" r="30" fill="#FFFFFF" opacity="0.1" />

      <!-- Chip -->
      <rect class="chip" x="30" y="40" width="45" height="34" rx="6" fill="url(#chipGrad)" />
      <line x1="30" y1="57" x2="75" y2="57" stroke="#D97706" stroke-width="1" />

      <!-- Card Number -->
      <text x="30" y="115" font-family="Courier, monospace" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="3">
        ••••  ••••  ••••  8842
      </text>

      <!-- Card Holder & Expiry -->
      <text x="30" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C7D2FE">PLATFORM CARD</text>
      <text x="30" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SPEND CONTROL</text>

      <text x="230" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#C7D2FE">EXPIRES</text>
      <text x="230" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">09/30</text>

      <!-- Card Brand Logo (Interlocking circles) -->
      <circle cx="265" cy="50" r="14" fill="#EF4444" opacity="0.9" />
      <circle cx="280" cy="50" r="14" fill="#F59E0B" opacity="0.9" />
    </g>
  </g>
</svg>
